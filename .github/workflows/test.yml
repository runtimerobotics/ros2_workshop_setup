name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
      - run: bash install.sh --help

  # Full install on a fresh ubuntu:24.04 container, piped like `curl | bash`.
  # No systemd in containers, so Docker is skipped here and covered below.
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create a sudo user like a workshop laptop
        run: |
          apt-get update && apt-get install -y sudo curl python3-venv
          useradd -m -s /bin/bash student
          echo 'student ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/student
      # A venv python first on PATH (like conda/pyenv/~/.local) must not break the build.
      - name: Install (piped, with a shadowing python3 on PATH)
        run: |
          su student -c "python3 -m venv ~/shadow-venv"
          su student -c "cd ~ && export PATH=\$HOME/shadow-venv/bin:\$PATH && cat $GITHUB_WORKSPACE/install.sh | bash -s ros --yes"
      - name: Re-run is safe
        run: su student -c "cd ~ && bash $GITHUB_WORKSPACE/install.sh --yes --docker skip"

  # Ubuntu 24.04 VM with systemd: ROS + simulation + Docker CPU mode.
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install (piped)
        run: cat install.sh | bash -s cpu --yes
